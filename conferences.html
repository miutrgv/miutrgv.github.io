      <script type="text/javascript" src="static/search_res.js?01"></script>
      <script>
        (function() {
          const container = document.getElementById('conferences');
          const markdownUrl = 'https://raw.githubusercontent.com/Christian-Narcia/Conferences/main/README.md';

          if (!container) {
            return;
          }

          container.classList.add('markdown-body');
          container.innerHTML = '<p>Loading conferences content from GitHub...</p>';

          fetch(markdownUrl)
            .then(function(response) {
              if (!response.ok) {
                throw new Error('HTTP ' + response.status + ' ' + response.statusText);
              }
              return response.text();
            })
            .then(function(markdown) {
              container.innerHTML = marked.parse(markdown, {
                headerIds: false,
                mangle: false,
                breaks: true
              });
            })
            .catch(function(error) {
              container.innerHTML = '<p style="color: red;">Failed to load conferences content from GitHub. ' +
                'Check the markdown URL and GitHub file permissions.<br>' +
                error.message + '</p>';
            });
        })();
      </script>
